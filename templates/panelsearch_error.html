<!doctype html>

<html lang="ja">

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <meta name="msapplication-TileColor" content="#00a300">
  <meta name="theme-color" content="#ffffff">

  <title>{% if r_error_type == 'info' %}Info{% else %}Error{% endif %}</title>
</head>

<body class="bg-light">
  <div class="container mt-5 text-center">
    <div class="alert alert-danger d-inline-block shadow-lg p-4 rounded text-left" style="max-width:600px;">
      <div class="d-flex align-items-center mb-3">
        {% if r_error_type == 'info' %}
        <i class="fa-solid fa-circle-info fa-2x mr-3 text-info"></i>
        <h4 class="m-0">INFO</h4>
        {% else %}
        <i class="fa-solid fa-circle-exclamation fa-2x text-danger mr-3"></i>
        <h4 class="m-0">ERROR</h4>
        {% endif %}
      </div>
      <p class="mb-2 text-muted">{{ r_error_message }}</p>
      {% if r_next_page %}
      <a href="{{ r_next_page }}" class="btn btn-primary mt-3">BACK</a>
      {% endif %}
    </div>
  </div>
</body>



</html>
