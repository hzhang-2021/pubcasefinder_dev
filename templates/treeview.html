</head>

<body>
  <div class="header_panel"><h1>PanelSearch Nanbyo Treeview</h1></div>
  <div class="main_panel">
    <div class="treeview_wrapper">
      <div class="upper">
        <input id="searchText" type="text" /><button id="btnSearch">Search</button>
      </div>
      <div class="middle">
        <table>
          <thead>
            <tr>
              <th class="pr-4">Panel ID</th>
              <th>Panel Name</th>
			 <th>TYPE</th>

              <th></th>
            </tr>
          </thead>
          <tbody id="panel_depth_list_tbody">
          </tbody>
        </table>
      </div>
      <div class="down"><ul id="treeView" class="ztree"></ul></div>
    </div>
    <div class="control_wrapper d-flex flex-column">
		<div><button id="btnExpandAll">Expand All</button></div>

        <div><button id="btnCollapseNode">Collapse Node</button></div>

		<div><button id="btnPaste" data-toggle="tooltip" data-trigger="manual" title="Copied!">Paste</button></div>
	</div>
  </div>

</body>


<script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct" crossorigin="anonymous"></script>


<script type="text/javascript" src="/static/zTree_v3/js/jquery.ztree.core.js"></script>
<script type="text/javascript" src="/static/zTree_v3/js/jquery.ztree.excheck.js"></script>
<script type="text/javascript" src="/static/zTree_v3/js/jquery.ztree.exedit.js"></script>
<script type="text/javascript" src="/static/js/panelsearch_nanbyo/utils.js"></script>

<SCRIPT LANGUAGE="JavaScript">
const URL_GET_PANEL_UPSTREAM_HIERARCHY = "/panelsearch_nanbyo_get_panel_upstream_trace",
	  URL_GET_PANEL_DESCENDANT = "/panelsearch_nanbyo_get_treeview_descendant"	;
	const URL_GET_ONTOLOGY = "/panelsearch_nanbyo_get_treeview";



function _check_panel_depth(type, depth_hash, node, depth){

	let panel_id = node.panel_id;

	if(panel_id in depth_hash){

	}else{
		depth_hash[panel_id] = {
			type: type,
			panel_name:node.panel_name_ja,
			depth_list:[]
		}
	}

	depth_hash[panel_id].depth_list.push(depth);

	if('children' in node){
		for(let child_node of node.children){
			_check_panel_depth(type, depth_hash, child_node, depth+1);
		}
	}
}

function _create_panel_depth_list_table(treeview_data){
	let depth_hash = {};

	_check_panel_depth('specified', depth_hash, treeview_data.children[0], 1);
	_check_panel_depth('unspecified', depth_hash, treeview_data.children[1], 1);
	let panel_id_list = Object.keys(depth_hash);

	let $tbody = $('#panel_depth_list_tbody');
	for(let panel_id of panel_id_list.sort()){
		let panel_name = depth_hash[panel_id].panel_name;
		let depth_list = depth_hash[panel_id].depth_list;
		let type = depth_hash[panel_id].type;
        
		let depth_list_str = depth_list.join(',');
		let isMultiClass = (depth_list.length > 1) ? '' : 'one';
		$(`
			<tr class="${isMultiClass}">
				<td class="pr-4">${panel_id}</td>
				<td>${panel_name}</td>
				<td>${type}</td>
				<td class="pr-2">${depth_list_str}</td>
				<td class="pr-2">
					<button class="load-upstream-btn" data-nando_id="${panel_id}" >
						Treeview
					</button>
				</td>
			</tr>
		`).appendTo($tbody);
	}

    $(document).on("click", ".load-upstream-btn", function(e){
        e.stopPropagation();
		e.preventDefault();
        let $btn = $(this);
        let nando_id=$btn.data('nando_id');
		_vgp_show_upstream_treeview(nando_id);
    });

	$(document).on("click", "tbody tr", function(e){
		$('tr.selected').removeClass('selected');
		$(this).addClass('selected');
	});
}

function _vgp_show_upstream_treeview(panel_id){

	let url_str = "/panelsearch_nanbyo_get_panel_upstream_trace?panel_id=" + panel_id;
 
   $.ajax({
      url: url_str, type: "GET", async: true, dataType: "json"
    }).done(function(data,textStatus,jqXHR) {

		let is_attach_descendant_cnt = true;
		let isFirstTimeLoad = true;
		utils_create_treeview_data_from_ontology(data, 'ja', is_attach_descendant_cnt, isFirstTimeLoad);

		_attach_display_name(cache_version_hash, data, 0);

		let treeview_data = [data];

		let settings = $.extend(true,{}, treeview_setting);
		zTreeObj = $.fn.zTree.init($("#treeView"), settings, treeview_data);
        setTimeout(function () {
            let nodes = zTreeObj.getNodes();
            _highlight_upstream_treeview_startNode(zTreeObj, nodes, panel_id);
        }, 100);

    }).fail(function(jqXHR, textStatus, errorThrown ) {
        alert('Server access error:' + textStatus + ":" + errorThrown + '\nURL: ' + url_str);
    });

}

function _highlight_upstream_treeview_startNode(zTree, nodes, panel_id) {
	for (var i = 0; i < nodes.length; i++) {
	
		if (nodes[i].panel_id == panel_id) {
			zTree.selectNode(nodes[i], true, true);
		}

		// 递归处理子节点
		if (nodes[i].isParent && nodes[i].children) {
			_highlight_upstream_treeview_startNode(zTree, nodes[i].children, panel_id);
		}
	}
}

function _attach_display_name(version_hash, treeview_data, depth){
	let version = version_hash[treeview_data.panel_id];

	if(['ALL','NANDO:0000003','UNSPECIFIED'].includes(treeview_data.panel_id) === false){
		if(depth === 2 && treeview_data.nando_id.indexOf('NANDO:11') < 0 ){
        	treeview_data['displayName'] += `
            	<span class="version">ver:${version}</span>
        	`;
    	}
		treeview_data['displayName'] += `
			<svg class="link-svg" data-nando_id="${treeview_data.panel_id}" title="Jump to Panel Detail Page(${treeview_data.panel_id})"></svg>
		`;
	}

	if('children' in treeview_data && treeview_data.children.length > 0){
		for(let sub_treeview_data of treeview_data.children){
			_attach_display_name(version_hash, sub_treeview_data, depth + 1);
		}
	}
}

var zTreeObj;
var cache_treeview_data = null;
var cache_version_hash = null;
var treeview_setting = {
	view: {selectedMulti: true, 
			fontCss: getFontCss,
			dblClickExpand: false, 
			showIcon: false, 
			nameIsHTML: true},
	async: {
		enable: true,
		type:   "get",
		url:	URL_GET_PANEL_DESCENDANT,
		autoParam: ["panel_id", "lang"],
		dataFilter: function(treeId, parentNode, childNodes) {
			if (!childNodes) return null;
			return utils_create_treeview_descendant_data(childNodes, 'ja');
		}
	},
	callback: {
		onClick: function (event, treeId, treeNode) {
		},
		beforeExpand: function (treeId, treeNode) {
			if (treeNode.isFirstTimeLoad) {
				zTreeObj.removeChildNodes(treeNode);
				treeNode.isParent = true;
				zTreeObj.reAsyncChildNodes(treeNode, "refresh");
			}
			return true;
		},
		onExpand: function (event, treeId, treeNode) {
			if(treeNode.isFirstTimeLoad){
				treeNode.isFirstTimeLoad = false;
			}
		},
		onAsyncSuccess:function (event, treeId, treeNode, msg) {
		},
		onCollapse: function (event, treeId, treeNode) {
		},
		onCheck: function (treeId, treeNode) {
		}
	},
	data: {
		key: {name: "displayName", title: "nando_id"}
		
	}
};

function _init_treeview(version_hash, treeview_data){


	_create_panel_depth_list_table(treeview_data);

	let is_attach_descendant_cnt = true;
	let isFirstTimeLoad = false;
	utils_create_treeview_data_from_ontology(
		treeview_data, 'ja', is_attach_descendant_cnt, isFirstTimeLoad
	);

	treeview_data.open = true;
	for( let node of treeview_data.children){
		node.open = true;
	}
	
	_attach_display_name(version_hash, treeview_data, 0);

	zTreeObj = $.fn.zTree.init($("#treeView"), {
		view: {
			selectedMulti:  false,
			fontCss: getFontCss,
			nameIsHTML: true
		},
		edit: {
			showRemoveBtn:  false,
			showRenameBtn:  false,
			enable: true,
			drag: {
				isCopy: true,
				isMove: true,
				prev:   true,
				inner:  true,
				next:   true,
			}
		},
		callback:{
			beforeDrag: beforeDrag,
			beforeDrop: beforeDrop
		},
		data: { key: {name: "displayName", title: "nando_id"}  }
	}, [treeview_data]);


	$(document).on("click", ".link-svg", function(e){
		e.stopPropagation();
		let $tag = $(this);
		let nando_id=$tag.data('nando_id');
		let urlstr = `/panelsearch_nanbyo_panel_detail?panel_id=${nando_id}&nando_id=${nando_id}&lang=ja`;
		window.open(urlstr, "_blank");
	});

	cache_treeview_data = treeview_data;
	cache_version_hash = version_hash;
}

function getFontCss(treeId, treeNode) {

    switch(treeNode.level) {

        case 2:
            return {
                color: "#ff0000",
                "font-weight": "bold"
            };

        case 3:
            return {
                color: "#0066ff",
                "font-weight": "bold"
            };

        default:
            if (treeNode.level >= 4) {
                return {
                    color: "#bc8d12"
                };
            }
            return {};
    }
}


function beforeDrag(treeId, treeNodes){
	for(let i=0, l=treeNodes.length;i<l; i++){
		if(treeNodes[i].drag === false){
			return false;
		}
	}
	return true;
}

function beforeDrop(treeId, treeNodes, targetNode, moveType){
	return targetNode ? targetNode.drop !== false: true;
}


function expandSubTree(treeObj, node) {

    treeObj.expandNode(
        node,
        true,   // expandFlag
        false,  // sonSign
        false,  // focus
        false   // callbackFlag
    );

    if (node.children) {
        node.children.forEach(function(child) {
            expandSubTree(treeObj, child);
        });
    }
}

var clipboardNode = null;

function isDescendant(node, targetId) {

    if (!node.children) {
        return false;
    }

    for (let child of node.children) {

        if (child.panel_id == targetId) {
            return true;
        }

        if (isDescendant(child, targetId)) {
            return true;
        }
    }

    return false;
}

function cloneSubtree(node) {

    let clone = {
		descendant_cnt: node.descendant_cnt,
		nando_id: node.nando_id,
        displayName: node.displayName,
        name: node.panel_name_ja,
		panel_name_ja: node.panel_name_ja,
		panel_name_en: node.panel_name_en,
		panel_id: node.panel_id
    };

    if (node.children && node.children.length > 0) {

        clone.children = node.children.map(
            child => cloneSubtree(child)
        );
    }

    return clone;
}

function containsNode(root, targetId) {

    if (root.panel_id == targetId) {
        return true;
    }

    if (!root.children) {
        return false;
    }

    for (const child of root.children) {

        if (containsNode(child, targetId)) {
            return true;
        }
    }

    return false;
}

function searchNode(keyword) {

    // 清除旧高亮
    clearHighlight(zTreeObj);

    if (!keyword) {
        return;
    }

    var result = zTreeObj.getNodesByParamFuzzy("displayName", keyword, null);


    if (!result || result.length === 0) {
        alert("Not found");
        return;
    }

	for(let node of result){
	    highlightNode(zTreeObj, node);
	}
}

function highlightNode(treeObj, node) {

    // 展开父节点
    var parent = node.getParentNode();

    while (parent) {
        treeObj.expandNode(parent, true, false, false);
        parent = parent.getParentNode();
    }

    // 增加class
    $("#" + node.tId)
        .addClass("highlight-node");

    // 选中
    treeObj.selectNode(node);

    // 滚动到可见区域
    document.getElementById(node.tId)
        .scrollIntoView({
            behavior: "smooth",
            block: "center"
        });
}
function clearHighlight(treeObj) {

    var nodes = treeObj.transformToArray(treeObj.getNodes());

    $.each(nodes, function (_, node) {
        $("#" + node.tId)
            .removeClass("highlight-node");
    });
}

$(document).ready(function(){


	document.getElementById("cbx_isMulti").addEventListener("change", function () {
		if(this.checked){
			$('tr.one').addClass('hide');
		}else{
			$('tr.one').removeClass('hide');
		}
	});


	fetch('/panelsearch_nanbyo_get_all_panel_version')
	.then(response1 => response1.json())
	.then(data1 => {
		fetch(URL_GET_ONTOLOGY)
		.then(response => response.json())
		.then(data => {
			_init_treeview(data1, data);
		});
	});
	$('#btnExpandAll').click(function(){
		zTreeObj.expandAll(true);
	});

    // add a button to collapse all nodes
    $('#btnCollapseAll').click(function(){
        zTreeObj.expandAll(false);
    });

	$('#btnExpandNode').click(function(){

		var selectedNodes = zTreeObj.getSelectedNodes();

		if (selectedNodes.length > 0) {
			var node = selectedNodes[0];

			expandSubTree(zTreeObj, node);

		} else {

			alert('Select a node first!');
		}
	});

    // add a button to collapse selected node
    $('#btnCollapseNode').click(function(){
        var selectedNodes = zTreeObj.getSelectedNodes();

        if (selectedNodes.length > 0) {
            var node = selectedNodes[0];

            zTreeObj.expandNode(node, false, false, false, false);

        } else {

            alert('Select a node first!');
        }
    });

$("#btnSearch").click(function () {
    searchNode($("#searchText").val().trim());
});

$('#btnCopy').tooltip();
$("#btnCopy").click(function () {

    var nodes = zTreeObj.getSelectedNodes();

    if (nodes.length === 0) {
        alert("Please select node to be copied.");
        return;
    }

    clipboardNode = nodes[0];

	 $(this).attr('data-original-title', '[ ' + clipboardNode.panel_name_ja + ' ] was copied')
            .tooltip('show');

        setTimeout(() => {
            $(this).tooltip('hide');
        }, 1500);
    console.log("Copied:", clipboardNode.id);
});

$('#btnPaste').tooltip();
$("#btnPaste").click(function () {

    if (!clipboardNode) {
        alert("Copy first!");
        return;
    }

    var nodes = zTreeObj.getSelectedNodes();

    if (nodes.length === 0) {
        alert("Please select the parent node!");
        return;
    }

    var targetParent = nodes[0];

    //
    // 自己贴到自己下面
    //
    if (targetParent.panel_id == clipboardNode.panel_id) {

        alert("Canot do cycle paste!");
        return;
    }

    //
    // 环检测
    //
    if (isDescendant(clipboardNode, targetParent.panel_id)) {

        alert("Will create cycle, Stop Paste!");
        return;
    }

    //
    // 重复关系检测
    //
    if (targetParent.children) {

        var exists = targetParent.children.some(
            c => c.panel_id == clipboardNode.panel_id
        );

        if (exists) {
            alert("The relation already exists!");
            return;
        }
    }

if (
    containsNode(
        clipboardNode,
        targetParent.parent_id
    )
) {
    alert("Stop due to there will be Cycle after paste!");
    return;
}

    //
    // UI增加节点
    //
	var copiedTree = cloneSubtree(clipboardNode);
    zTreeObj.addNodes( targetParent, copiedTree );

    $(this).attr('data-original-title', `[ ${copiedTree.panel_name_ja} ] was copied below [ ${targetParent.panel_name_ja} ]`)
           .tooltip('show');

        setTimeout(() => { $(this).tooltip('hide');}, 1500);

	clipboardNode = null;
	zTreeObj.cancelSelectedNode(targetParent);
});


 });
</SCRIPT>
