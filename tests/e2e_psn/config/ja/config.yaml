# IDs and golden expectations must match your PSN environment.
settings:
  origin: http://pcf.bits.cc
  lang: ja
  test_result_path: test_result/ja
  auth_states:
    member: playwright/.auth/state.json
    curator: playwright/.auth/curator.json
    admin: playwright/.auth/state.json
pages:
  panel_list:
    path: /panelsearch_nanbyo
    role: anonymous
    visible:
    - '#vgp-filter'
    - '#vgp-treeView'
    - '#vgp-list-root-panel'
    load_apis:
    - /panelsearch_nanbyo_get_all_panel
    - /panelsearch_nanbyo_get_treeview
    tabs: []
  panel_detail:
    path: /panelsearch_nanbyo_panel_detail
    role: anonymous
    visible:
    - '#vgp-panel-name'
    - '#btn_download_panel'
    - '#nav-tab'
    load_apis:
    - /panelsearch_nanbyo_get_panel_review
    tabs:
    - - '#nav-vgp-version-comments-panel'
      - '#vgp-version-comments-panel'
    - - '#nav-vgp-reviewers-panel'
      - '#vgp-reviewers-panel'
    - - '#nav-vgp-panel-genes-panel'
      - '#vgp-panel-genes-panel'
    query:
      panel_id: 'NANDO:1200477'
    required_query:
    - panel_id
  panel_entity_detail:
    path: /panelsearch_nanbyo_panel_entity_detail
    role: anonymous
    visible:
    - '#vgp-panel-gene-name'
    - '#vgp-summary-table'
    - '#nav-tab'
    load_apis:
    - /panelsearch_nanbyo_get_panel_entity_review
    tabs:
    - - '#nav-vgp-history-panel'
      - '#vgp-history-panel'
    - - '#nav-vgp-panel-gene-review-panel'
      - '#vgp-panel-gene-review-panel'
    query:
      panel_id: 'NANDO:1200477'
      nando_id: 'NANDO:1200477'
      entity_type_id: '1'
      entity_name: 'ACTA1'
      gene_id: '58'
      gene_symbol: 'ACTA1'
    required_query:
    - panel_id
    - entity_name
    - gene_id
    - gene_symbol
  ontology:
    path: /panelsearch_nanbyo_ontology
    role: anonymous
    visible:
    - '#ontology-list-table'
    - '#btn_load_selected_ttl_db'
    load_apis:
    - /panelsearch_nanbyo_get_ontology_data
    tabs: []
  admin_user:
    path: /panelsearch_nanbyo_admin_user
    role: admin
    visible:
    - '#user-table'
    - '#filter_letter'
    - '#btn_filter_group'
    - '#btn_filter_status'
    load_apis:
    - /panelsearch_nanbyo_admin_load_user
    tabs: []
  admin_group:
    path: /panelsearch_nanbyo_admin_group
    role: admin
    visible:
    - '#group_list_table'
    - '#group_filter'
    load_apis:
    - /panelsearch_nanbyo_admin_group_load_data
    tabs: []
  admin_group_activity:
    path: /panelsearch_nanbyo_admin_group_activity
    role: admin
    visible:
    - '#activity_table'
    - '#filter_letter'
    - '#total_num'
    load_apis:
    - /panelsearch_nanbyo_admin_load_group_activity
    tabs: []
  admin_activity:
    path: /panelsearch_nanbyo_admin_activity
    role: member
    visible:
    - '#activity_table'
    - '#btn_filter_panel'
    - '#dateFrom'
    - '#dateTo'
    load_apis:
    - /panelsearch_nanbyo_admin_load_activity
    tabs: []
  admin_authentication:
    path: /panelsearch_nanbyo_admin_authentication
    role: admin
    visible:
    - '#authlog_table'
    - '#filter_letter'
    - '#dateFrom'
    - '#dateTo'
    load_apis:
    - /panelsearch_nanbyo_admin_load_authentication_log
    tabs: []
  admin_incharge:
    path: /panelsearch_nanbyo_admin_incharge
    role: admin
    visible:
    - '#activity_table'
    - '#total_num'
    load_apis:
    - /panelsearch_nanbyo_admin_load_incharge_activity
    - /panelsearch_nanbyo_admin_load_incharge_check_history
    tabs: []
  admin_profile:
    path: /panelsearch_nanbyo_admin_profile
    role: member
    visible:
    - '#vgp-user-input-table-wrapper'
    - '#vgp-user-btn-edit'
    load_apis: []
    tabs: []
  admin_review:
    path: /panelsearch_nanbyo_admin_review
    role: member
    visible:
    - '#main_content .wrapper.title'
    load_apis:
    - /panelsearch_nanbyo_get_user_review_and_comment
    tabs: []
    attached:
    - '#panel_entity_review_list_wrapper'
  admin_mail:
    path: /panelsearch_nanbyo_admin_mail
    role: admin
    visible:
    - '#email_table'
    - '#btn_load_email'
    load_apis: []
    tabs:
    - - '#nav-template-panel'
      - '#template-panel'
    - - '#nav-smtp-panel'
      - '#smtp-panel'
    - - '#nav-log-panel'
      - '#log-panel'
