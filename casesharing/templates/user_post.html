<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask Multiple Inputs Example</title>
</head>
<body>
    <h1>User addition test</h1>
    <form method="POST" action="/casesharing/users">
        <label for="input1">Google ID</label>
        <input type="text" id="google_id" name="google_id"><br><br>
        
        <label for="input2">First name (English)</label>
        <input type="text" id="first_name_en" name="first_name_en"><br><br>
        
        <label for="input3">Last name (English)</label>
        <input type="text" id="last_name_en" name="last_name_en"><br><br>
        
        <label for="input4">Affiliation (English)</label>
        <input type="text" id="affiliation_en" name="affiliation_en"><br><br>
        
        <label for="input5">Job title (English)</label>
        <input type="text" id="job_title_en" name="job_title_en"><br><br>
        
        <label for="input6">Group (English)</label>
        <input type="text" id="group_en" name="group_en"><br><br>
        
        <label for="input7">First name (native)</label>
        <input type="text" id="first_name_nl" name="first_name_nl"><br><br>
        
        <label for="input8">Last name (native)</label>
        <input type="text" id="last_name_nl" name="last_name_nl"><br><br>
        
        <label for="input9">Affiliation (native)</label>
        <input type="text" id="affiliation_nl" name="affiliation_nl"><br><br>
        
        <label for="input10">Job title (native)</label>
        <input type="text" id="job_title_nl" name="job_title_nl"><br><br>
        
        <label for="input11">Group (native)</label>
        <input type="text" id="group_nl" name="group_nl"><br><br>
        
        <label for="input12">User type</label>
        <input type="number" id="user_type" name="user_type"><br><br>
        
        <label for="input13">Email</label>
        <input type="text" id="email" name="email"><br><br>
        
        <label for="input14">Authentication code</label>
        <input type="text" id="authentication_code" name="authentication_code"><br><br>
        
        <input type="submit" value="Submit">
    </form>
</body>
</html>
